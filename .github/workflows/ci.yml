name: CI

on:
  push:
    branches:
      - phase-1-saas-foundation
  pull_request:

jobs:
  deterministic-checks:
    name: Deterministic PR Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:rate-limit
      - run: npm run test:notifications
      - run: node scripts/token-metrics-test.mjs
      - name: Secret scan
        run: |
          if git ls-files | grep -E '(^|/)\.env$' || git ls-files | grep -E '(^|/)\.env\.(local|staging\.local)$'; then
            echo "Tracked env files are not allowed"
            exit 1
          fi
          if git grep -I -n -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9]|LIVEKIT_API_SECRET=[A-Za-z0-9]' -- ':!.env.example' ':!*.md' ':!.github/workflows/*'; then
            echo "Possible secret material found in tracked files"
            exit 1
          fi
          echo "No tracked env files or obvious secret material"
        shell: bash

  staging-integration-security:
    name: Protected Staging Security Integration
    needs: deterministic-checks
    if: github.ref == 'refs/heads/phase-1-saas-foundation' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute Staging Security & Onboarding Integration Harness
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_LIVEKIT_TOKEN_ENDPOINT: ${{ secrets.VITE_LIVEKIT_TOKEN_ENDPOINT }}
          VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
          LIVEKIT_HOST: ${{ secrets.LIVEKIT_HOST }}
          STAGING_TEST_HOST_EMAIL: ${{ secrets.STAGING_TEST_HOST_EMAIL }}
          STAGING_TEST_HOST_PASSWORD: ${{ secrets.STAGING_TEST_HOST_PASSWORD }}
          STAGING_TEST_PARTICIPANT_EMAIL: ${{ secrets.STAGING_TEST_PARTICIPANT_EMAIL }}
          STAGING_TEST_PARTICIPANT_PASSWORD: ${{ secrets.STAGING_TEST_PARTICIPANT_PASSWORD }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            node scripts/verify-staging-migrations.mjs
            node scripts/verify-all-sprint-objectives.mjs
            node scripts/staging-token-acceptance.mjs
            node scripts/staging-invitation-e2e.mjs
          else
            echo "Staging secrets not configured in repository environment. Skipped runtime staging execution."
          fi
