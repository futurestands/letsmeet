name: CI

on:
  push:
    branches:
      - phase-1-saas-foundation
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/phase3-livekit-endpoint-test.mjs
      - name: Secret scan
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)'; then
            echo "Tracked env files are not allowed"
            exit 1
          fi
          echo "No tracked env files"
        shell: bash
