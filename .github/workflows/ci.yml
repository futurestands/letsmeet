name: CI

on:
  push:
    branches:
      - phase-1-saas-foundation
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/phase3-livekit-endpoint-test.mjs
      - name: Secret scan
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)'; then
            echo "Tracked env files are not allowed"
            exit 1
          fi
          if git grep -I -n -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY=[^y]|LIVEKIT_API_SECRET=[^y]' -- ':!.env.example' ':!*.md'; then
            echo "Possible secret material found in tracked files"
            exit 1
          fi
          echo "No tracked env files or obvious secret material"
        shell: bash
      - name: Note Windows-only DB suites
        run: echo "phase2-6 PostgreSQL security suites require local/Windows Postgres and are executed outside GitHub Actions."
      - name: Note staging dual-browser E2E
        run: echo "Playwright dual-browser E2E (npm run test:e2e:dual) requires staging secrets and system Chrome; run locally/CI with secrets, not on PRs from forks."
